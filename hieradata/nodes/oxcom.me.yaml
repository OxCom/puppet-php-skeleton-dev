---
classes:
    - role::vps

certbot: true

projects:
    sushi:
        - { name: www, tpl: 'docker', port: 8940, ws: [ '/build' ] }
        - { name: s3, tpl: 'proxy', port: 8940 }
        - { name: s3-cli, tpl: 'proxy', port: 8940, ws: [ '/ws' ] }
        - { name: conv, tpl: 'proxy', port: 8940 }

php:
    composer: true
    versions: [ php8.4, php8.5 ]
    packages: [
        opcache, gd, intl, mbstring, curl,
        mysql, readline, soap, sqlite3, tidy, xml, zip,
        codecoverage, codesniffer, igbinary, imagick,
        redis, xdebug, ssh2, bcmath, apcu, amqp
    ]
    # Packages bundled into PHP itself for specific versions (no separate apt package exists)
    exclude_packages:
        php8.5: [ opcache ]

tools: [
    firefox, chromium-codecs-ffmpeg-extra, chromium-browser,
    imagemagick, webp, libwebp-dev, php-json
]

db:
    mariadb:
        root_password: root
        remove_default_accounts: true
        override_options:
            client:
                ssl: false
            mysqld:
                bind-address: '127.0.0.1,172.17.0.1,172.18.0.1'
                skip_ssl: 1
                ssl-disable: true
                wait_timeout: 28800
                interactive_timeout: 28800
                max_allowed_packet: 1024M
                # will cache frequently read data
                innodb_buffer_pool_size: 4G
                # larger buffer reduces write I/O to Transaction Logs
                innodb_log_buffer_size: 256M
                # larger log file reduces checkpointing and write I/O
                innodb_log_file_size: 1G
                # service write operations to .ibd files.
                innodb_write_io_threads: 8
                # flushes the InnoDB Log Buffer to the Transaction Logs (ib_logfile0, ib_logfile1) once per second
                innodb_flush_log_at_trx_commit: 0
                # configure max connections to SQL server to handle the load
                max_connections: 2048

docker:
    # Allow users to execute docker commands
    users: [ 'vagrant' ]
